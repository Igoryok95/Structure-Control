name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and native game tests
        run: |
          chmod +x gradlew
          ./gradlew -PgameTests test runGameTestServer --console=plain
      - name: Restart persistence test
        run: python3 tools/restart_smoke.py
      - name: Build release without test fixtures
        run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: structure-control
          path: build/libs/*.jar
